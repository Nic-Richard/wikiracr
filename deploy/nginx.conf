server {
    server_name wikiracr.com;

    # Serve the built React app.
    root /var/www/wikiracr/client/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests.
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # Proxy Socket.IO with WebSocket upgrade headers.
    location /socket.io {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade     $http_upgrade;
        proxy_set_header Connection  "upgrade";
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wikiracr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wikiracr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Redirect www to the apex domain.
server {
    listen 443 ssl;
    server_name www.wikiracr.com;

    ssl_certificate /etc/letsencrypt/live/wikiracr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wikiracr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wikiracr.com$request_uri;
}

server {
    if ($host = www.wikiracr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = wikiracr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name wikiracr.com www.wikiracr.com;
    return 404; # managed by Certbot




}
