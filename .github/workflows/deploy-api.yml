name: Deploy API

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wikiracr-production-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --json conclusion --jq '.[0].conclusion')
          test "$result" = success || { echo 'This commit must pass CI before deployment.'; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build website
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          case "$VITE_CLERK_PUBLISHABLE_KEY" in pk_live_*) ;; *) echo 'Set the Production VITE_CLERK_PUBLISHABLE_KEY variable.'; exit 1;; esac
          test -n "$VITE_SERVER_URL"
          npm ci --prefix client
          npm run build --prefix client
          test -f client/dist/index.html
      - name: Deploy API source and website
        env:
          DEPLOY_KEY: ${{ secrets.WIKIRACR_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WIKIRACR_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/wikiracr-deploy-key"
          hosts="$RUNNER_TEMP/wikiracr-known-hosts"
          archive="$RUNNER_TEMP/wikiracr-source.tar"
          trap 'rm -f "$key" "$hosts" "$archive"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          git archive --format=tar HEAD server/src server/scripts server/package.json server/package-lock.json > "$archive"
          tar -rf "$archive" client/dist
          gzip -c "$archive" |
            ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" root@5.78.178.181 "deploy $GITHUB_SHA"
